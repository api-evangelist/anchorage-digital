- aid: anchorage-digital:anchorage-digital-vaults-api
  name: Anchorage Digital Vaults API
  description: >-
    An Anchorage Digital organization has one or more vaults. Each vault may contain one or more assets
    which are held in wallets. Each wallet may be comprised of one or more addresses depending on the
    type of the asset, i.e. UTXO-based assets and account-based assets.


    ### Balances


    Each asset in a vault has an `availableBalance` and a `totalBalance`. The `availableBalance` is the
    balance that is available to be withdrawn, held, or transferred. The `totalBalance` may contain funds
    that are held, in-progress, or locked for activities like voting.


    #### Vault IDs


    Each vault has an ID that is uniquely identifiable across the Anchorage Digital platform and can be
    used to reference this vault using the Anchorage Digital API. The vault ID is available as the `vaultId`
    field in the API response, or in the Vaults tab of the Anchorage Digital Web Dashboard.


    #### Allow API Access to a Vault


    By default, an Anchorage Digital vault does not allow API access. To allow programmatic management
    of addresses and transfers or read access to balances and transactions, create a [permission group](#section/Authentication-and-Security/Permission-Groups)
    with the desired permissions (read, transfer, etc.) for that vault. Any API key that is associated
    with this permission group will have API access to that vault.
  humanURL: https://docs.anchorage.com/knowledge-base/api-reference/introduction
  baseURL: https://api.anchorage.com/v2

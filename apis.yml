- aid: anchorage-digital:anchorage-digital-onboarding-api
  name: Anchorage Digital Onboarding API
  description: >-
    These endpoints allow clients/partner institutions to start the customer onboarding process for a
    B2B2B/B2B2C end customer who would not be using the Anchorage Digital applications directly. They
    collect the required data and documentation for Anchorage Digital to satisfy its regulatory obligations
    to perform KYB/KYC, CIP, CDD and EDD on its customers and related parties.


    Currently only B2B2B/B2B2C customer onboarding is supported.


    ### Payload Data

    The "customer" endpoints take a payload of `entries` in an array of key/value pairs. Details on the
    required and support key/value pairs is available in documentation provided by Anchorage Digital.
    Please contact your Customer Experience representative for details.


    Note that some of the keys are conditional depending on the presence or value of other key/value pairs.
    For example, the key `legalStructureOther` is only required if the `legalStructure` key has the Enum
    value `OTHER`.


    Also note that every `value` field accepts primitives, objects and collections, which makes the payload
    very flexible for the client's needs.

    For example, both of the following `entries` are accepted and interchangeable:


    ```json

    {
      "entries":[
        {
          "key":"boolField",
          "value":true
        },
        {
          "key":"numberField",
          "value":10
        },
        {
          "key":"stringField",
          "value":"stringFieldValue"
        },
        {
          "key":"collectionField",
          "value":[
            "collectionField0Value",
            "collectionField1Value"
          ]
        },
        {
          "key":"objectField",
          "value":{
            "field0":"field0Value",
            "field1":"field1Value",
            "field2":"field2Value"
          }
        },
        {
          "key":"objectCollectionField",
          "value":[
            {
              "field0":"field0AValue",
              "field1":"field1AValue",
              "field2":"field2AValue"
            },
            {
              "field0":"field0BValue",
              "field1":"field1BValue",
              "field2":"field2BValue"
            }
          ]
        }
      ]
    }

    ```


    ```json

    {
      "entries":[
        {
          "key":"boolField",
          "value":true
        },
        {
          "key":"numberField",
          "value":10
        },
        {
          "key":"stringField",
          "value":"stringFieldValue"
        },
        {
          "key":"collectionField.0",
          "value":"collectionField0Value"
        },
        {
          "key":"collectionField.1",
          "value":"collectionField1Value"
        },
        {
          "key":"objectField.field0",
          "value":"field0Value"
        },
        {
          "key":"objectField.field1",
          "value":"field1Value"
        },
        {
          "key":"objectField.field2",
          "value":"field2Value"
        },
        {
          "key":"objectCollectionField.0.field0",
          "value":"field0AValue"
        },
        {
          "key":"objectCollectionField.0.field1",
          "value":"field1AValue"
        },
        {
          "key":"objectCollectionField.0.field2",
          "value":"field2AValue"
        },
        {
          "key":"objectCollectionField.1.field0",
          "value":"field0BValue"
        },
        {
          "key":"objectCollectionField.1.field1",
          "value":"field1BValue"
        },
        {
          "key":"objectCollectionField.1.field2",
          "value":"field2BValue"
        }
      ]
    }

    ```

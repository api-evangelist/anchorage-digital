name: Anchorage Digital
description: >-
  Anchorage Digital is a regulated digital-asset platform for institutions, operating
  Anchorage Digital Bank, N.A. — the first federally chartered (OCC) crypto bank in the
  United States — plus regulated entities in Singapore and New York. It provides qualified
  custody, trading (Anchorage Digital Prime), staking, on-chain settlement via the Atlas
  Settlement Network, stablecoin issuance and conversion, governance participation, and tax
  reporting. Its REST API v2.0 exposes 134 operations across custody, wallets, transfers,
  trading, Atlas settlement, onboarding, subaccounts, tax, and webhook notifications, secured
  with API keys plus Ed25519 request signing. Anchorage also ships an Agentic Banking product
  with a hosted MCP server that lets AI agents spend against pre-authorized budgets.

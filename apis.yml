- aid: anchorage-digital:anchorage-digital-wallets-api
  name: Anchorage Digital Wallets API
  description: >-
    A vault has one or more wallets. Each wallet is a collection of one or more addresses depending on
    the asset type. A wallet is created for a particular blockchain network, e.g. Bitcoin, Ethereum, etc.


    ### Balances

    Depending on the blockchain network of the wallet, a wallet may hold one or more asset types. An asset
    in a wallet has an `availableBalance` and a `totalBalance`. The `availableBalance` is the balance
    that is available to be withdrawn, held, or transferred. The `totalBalance` may contain funds that
    are held, in-progress, or locked for activities like voting.


    ### Addresses

    A wallet is a collection of one or more addresses depending on the asset type. The `depositAddress`
    contains the last address to be provisioned to that wallet. For UTXO-based assets this address could
    change as new deposit addresses are provisioned. For account-based assets, this address will not change
    as only one address may be provisioned per wallet. To see all addresses for an asset, use the [Addresses
    endpoint](#tag/Addresses).


    ### Default Wallets

    Each asset type within a vault has a default wallet that is used for a particular asset when only
    the vault is specified. For example, a transfer between two vaults will take the asset from the default
    wallet for that asset in the sending vault and send it to the default wallet for that asset in the
    destination vault. Each wallet has a `isDefault` flag that indicates whether it is the default wallet.


    ### Maximum Allowed Wallets and Creation Constraints

    We have a constraint of 10,000 wallets per asset and defined a creation limit of 10 wallets per asset
    per 30 minutes interval. Theses contraints are imposed at the organization level.
  humanURL: https://docs.anchorage.com/knowledge-base/api-reference/introduction
  baseURL: https://api.anchorage.com/v2
  tags:
  - Wallets
  properties:

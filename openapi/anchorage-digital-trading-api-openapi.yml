                      counterCurrency: BTC
                      orderQty: '10000.00'
                      orderType: STOP_LIMIT
                      timeInForce: GTC
                      orderStatus: PENDING_NEW
                      execId: 58fd5afc-b85e-45d1-951e-d6429ea9cd54

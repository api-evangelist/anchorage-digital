            type: DEPOSIT
            transactionTime: '2022-07-30T22:15:31.99999Z'
            received:
              assetType: BTC
              costBasis: '2500'
              quantity: '1.0'
          - id: 3459f4d4-078b-4e44-a308-7662fec0f546
            type: WITHDRAW

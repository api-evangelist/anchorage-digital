description: Anchorage Agentic Banking exposes a hosted MCP server that lets an AI agent, once linked
  via OAuth consent from the Agents page at agentic.anchorage.com, execute payments against pre-authorized
  budgets on the crypto rail and make card purchases (with passkey approval) under merchant allowlists
  and spend budgets set by the user. This is a distinct surface from the Anchorage Digital REST API v2.0
  (API-key + Ed25519 signature auth) — it is the agent-native banking product, not an autogenerated wrapper
  of the REST operations.
tools:
- name: introspect_agent
  description: Return the agent's identity, linked account, and available spending budgets.
- name: check_budget
  description: Read the standing spend budget available to the agent.
- name: pay_url
  description: Fetch and pay a paid URL on the crypto rail using a standing budget.
- name: buy_with_linked_card
  description: Request a card purchase; issues a one-shot scoped card credential, requires passkey approval
    via browser.
